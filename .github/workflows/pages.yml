name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Pull LFS files
        run: git lfs pull
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Copy static assets to dist
        run: |
          cp twgl.min.js zoo.js serialize.js PNGView.js embedding-space.js embedding-datasets.js \
             lenia.js game-engine.js collection-storage.js names.js parameters.json \
             reconstruction-worker.js dat.gui.min.js audiosys.js webm-writer2.js videowriter.js dist/
          cp graph.html index.html dist/
          cp touch.svg herd.svg doubleclick.svg mouse.svg pinch.svg space.svg lenia_card.jpg dist/
          cp -r levels datasets resources simulation dist/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
